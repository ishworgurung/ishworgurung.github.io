# Social links displayed by al-folio (jekyll-socials).
# Written as custom entries so each icon gets a proper hover title; the plugin's
# built-in keys (facebook_id, github_username, ...) would show titles such as
# "Facebook id". Keys are prefixed so they never match a built-in name.
my_email:
  logo: fa-solid fa-envelope
  url: mailto:me@ishworgurung.com
  title: Email
my_github:
  logo: fa-brands fa-github
  url: https://github.com/ishworgurung
  title: GitHub
my_linkedin:
  logo: fa-brands fa-linkedin
  url: https://www.linkedin.com/in/ishworgurung
  title: LinkedIn
my_x:
  logo: fa-brands fa-x-twitter
  url: https://x.com/ishw0rgurung
  title: X
my_facebook:
  logo: fa-brands fa-facebook
  url: https://facebook.com/ishwor.gurung
  title: Facebook
my_keybase:
  logo: fa-brands fa-keybase
  url: https://keybase.io/isg
  title: Keybase
my_rss:
  logo: fa-solid fa-square-rss
  url: /feed.xml
  title: RSS feed
